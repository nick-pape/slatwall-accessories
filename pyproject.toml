[project]
name = "slatwall-accessories"
version = "0.1.0"
description = "Parametric build123d slatwall accessories (PTFE swivel guide, sleeves)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "networkx>=3.7",
    "pyglet<2",
    "rtree>=1.4.1",
    "shapely>=2.2.0",
    "trimesh>=5.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slathook"]
